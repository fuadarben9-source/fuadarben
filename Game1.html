<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Kata - Belajar Bahasa Inggris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sun: #FFD93D;
    --sky: #6BCBFF;
    --bubblegum: #FF6FA5;
    --grass: #4CD787;
    --cream: #FFF9F0;
    --plum: #3D2C5C;
    --plum-soft: #6B5A8E;
    --white: #FFFFFF;
    --shadow: rgba(61,44,92,0.18);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 10% 15%, #FFF3C4 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #C9F0FF 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #FFD9EA 0%, transparent 45%),
      var(--cream);
    color: var(--plum);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 16px 40px;
  }

  /* ---------- Header ---------- */
  .topbar{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom: 18px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--plum);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo .mascot-mini{ font-size: 1.3em; display:inline-block; }
  .score-pill{
    background: var(--white);
    border-radius: 999px;
    padding: 8px 16px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 18px;
    box-shadow: 0 4px 0 var(--shadow);
    display:flex; align-items:center; gap:6px;
    color: var(--plum);
  }

  /* ---------- Progress stars ---------- */
  .progress-row{
    width:100%; max-width:640px;
    display:flex;
    gap:6px;
    margin-bottom: 18px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .prog-star{
    width: 30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px;
    filter: grayscale(1) opacity(0.35);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .35s ease;
  }
  .prog-star.filled{
    filter:none;
    transform: scale(1.15) rotate(-8deg);
  }

  /* ---------- Category chooser ---------- */
  .category-grid{
    width:100%; max-width: 640px;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (min-width: 520px){
    .category-grid{ grid-template-columns: repeat(3, 1fr); }
  }
  .cat-card{
    border:none;
    cursor:pointer;
    border-radius: 24px;
    padding: 22px 12px 16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 17px;
    color: var(--plum);
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cat-card:active{ transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .cat-card .cat-emoji{ font-size: 40px; }
  .cat-card.c1{ background: #FFE7A0; }
  .cat-card.c2{ background: #BDEBFF; }
  .cat-card.c3{ background: #FFC7DC; }
  .cat-card.c4{ background: #C6F5D6; }
  .cat-card.c5{ background: #E4D4FF; }

  .intro-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    text-align:center;
    font-size: clamp(20px, 4.5vw, 26px);
    margin: 6px 0 4px;
  }
  .intro-sub{
    text-align:center;
    color: var(--plum-soft);
    font-weight:700;
    margin-bottom: 10px;
  }

  /* ---------- Mascot ---------- */
  .mascot-wrap{
    display:flex; justify-content:center;
    margin: 6px 0 10px;
  }
  .mascot{
    font-size: 64px;
    display:inline-block;
    animation: float 2.6s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px var(--shadow));
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-10px) rotate(3deg); }
  }
  .mascot.happy{ animation: bounceHappy .6s ease; }
  .mascot.sad{ animation: shakeSad .5s ease; }
  @keyframes bounceHappy{
    0%{ transform: scale(1) rotate(0); }
    30%{ transform: scale(1.35) rotate(-10deg); }
    60%{ transform: scale(1.1) rotate(8deg); }
    100%{ transform: scale(1) rotate(0); }
  }
  @keyframes shakeSad{
    0%,100%{ transform: translateX(0) rotate(0); }
    25%{ transform: translateX(-8px) rotate(-6deg); }
    75%{ transform: translateX(8px) rotate(6deg); }
  }
  .speech{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    text-align:center;
    color: var(--plum);
    background: var(--white);
    border-radius: 18px;
    padding: 8px 18px;
    box-shadow: 0 4px 0 var(--shadow);
    min-height: 20px;
    max-width: 90%;
  }

  /* ---------- Question card ---------- */
  .game-panel{
    width:100%; max-width: 480px;
    display:flex; flex-direction:column; align-items:center;
  }
  .word-card{
    width: 100%;
    background: var(--white);
    border-radius: 32px;
    padding: 28px 20px 22px;
    display:flex; flex-direction:column; align-items:center;
    box-shadow: 0 10px 0 var(--shadow);
    margin-bottom: 22px;
    position:relative;
  }
  .prompt-label{
    font-weight:800;
    color: var(--bubblegum);
    letter-spacing: 0.5px;
    font-size: 13px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .big-emoji{
    font-size: 96px;
    line-height:1;
    margin: 6px 0 4px;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{
    0%{ transform: scale(0.5); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .indo-hint{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 20px;
    color: var(--plum-soft);
  }
  .speaker-btn{
    position:absolute;
    top: 16px; right: 16px;
    width: 44px; height:44px;
    border-radius: 50%;
    border:none;
    background: var(--sky);
    color: var(--white);
    font-size: 20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 4px 0 #4aa8d9;
  }
  .speaker-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 #4aa8d9; }
  .speaker-btn.speaking{ animation: pulseSpeak .5s ease infinite; }
  @keyframes pulseSpeak{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }

  .options{
    width:100%;
    display:flex; flex-direction:column;
    gap: 14px;
  }
  .opt-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 22px;
    padding: 16px 20px;
    border-radius: 20px;
    border: none;
    cursor:pointer;
    background: var(--white);
    color: var(--plum);
    box-shadow: 0 5px 0 var(--shadow);
    text-align:center;
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
  }
  .opt-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .opt-btn:focus-visible{ outline: 3px solid var(--sky); outline-offset:2px; }
  .opt-btn.correct{
    background: var(--grass);
    color: var(--white);
    box-shadow: 0 5px 0 #2fa869;
    animation: bounceHappy .5s ease;
  }
  .opt-btn.wrong{
    background: var(--bubblegum);
    color: var(--white);
    box-shadow: 0 5px 0 #cc4f7f;
    animation: shakeSad .4s ease;
  }
  .opt-btn:disabled{ cursor:default; }

  /* ---------- Bottom controls ---------- */
  .bottom-row{
    display:flex; gap:10px; margin-top:4px;
  }
  .ghost-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    background: transparent;
    color: var(--plum-soft);
    border: 2px solid #E3DAF2;
    border-radius: 999px;
    padding: 8px 18px;
    cursor:pointer;
  }
  .ghost-btn:active{ transform: scale(0.96); }

  /* ---------- Result screen ---------- */
  .result-card{
    width:100%; max-width: 480px;
    background: var(--white);
    border-radius: 32px;
    padding: 36px 24px;
    text-align:center;
    box-shadow: 0 10px 0 var(--shadow);
  }
  .result-emoji{ font-size: 80px; margin-bottom: 6px; }
  .result-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 26px;
    margin-bottom: 6px;
  }
  .result-sub{
    color: var(--plum-soft);
    font-weight:700;
    margin-bottom: 18px;
  }
  .stars-final{ font-size: 34px; letter-spacing: 6px; margin-bottom: 22px; }
  .primary-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 19px;
    color: var(--white);
    background: var(--bubblegum);
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    box-shadow: 0 6px 0 #cc4f7f;
    cursor:pointer;
  }
  .primary-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #cc4f7f; }
  .secondary-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 16px;
    color: var(--plum-soft);
    background: transparent;
    border: none;
    margin-top: 12px;
    cursor:pointer;
    text-decoration: underline;
  }

  .hidden{ display:none !important; }

  /* Confetti */
  .confetti-piece{
    position: fixed;
    top: -20px;
    width: 10px; height: 14px;
    border-radius: 2px;
    z-index: 999;
    pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .mascot, .opt-btn, .big-emoji, .prog-star, .confetti-piece{ animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="topbar">
    <div class="logo"><span class="mascot-mini">🦉</span> Petualangan Kata</div>
    <div class="score-pill" id="scorePill">⭐ 0</div>
  </div>

  <!-- ===== SCREEN 1: Pilih Kategori ===== -->
  <div id="screenIntro">
    <div class="intro-title">Ayo belajar kata baru!</div>
    <div class="intro-sub">Pilih tema yang mau kamu mainkan 👇</div>
    <div class="mascot-wrap"><div class="mascot" id="mascotIntro">🦉</div></div>
    <div class="category-grid">
      <button class="cat-card c1" data-cat="animals"><span class="cat-emoji">🐶</span>Hewan</button>
      <button class="cat-card c2" data-cat="colors"><span class="cat-emoji">🎨</span>Warna</button>
      <button class="cat-card c3" data-cat="fruits"><span class="cat-emoji">🍎</span>Buah</button>
      <button class="cat-card c4" data-cat="numbers"><span class="cat-emoji">🔢</span>Angka</button>
      <button class="cat-card c5" data-cat="body"><span class="cat-emoji">🙌</span>Badan</button>
    </div>
  </div>

  <!-- ===== SCREEN 2: Game ===== -->
  <div id="screenGame" class="hidden">
    <div class="progress-row" id="progressRow"></div>

    <div class="mascot-wrap">
      <div class="mascot" id="mascotGame">🦉</div>
    </div>
    <div class="speech" id="speechBubble">Yuk pilih jawaban yang benar!</div>

    <div class="game-panel" style="margin-top:16px;">
      <div class="word-card">
        <button class="speaker-btn" id="btnSpeaker" aria-label="Dengarkan ucapan">🔊</button>
        <div class="prompt-label">Apa bahasa Inggrisnya?</div>
        <div class="big-emoji" id="bigEmoji">🐶</div>
        <div class="indo-hint" id="indoHint">Anjing</div>
      </div>

      <div class="options" id="optionsWrap"></div>

      <div class="bottom-row">
        <button class="ghost-btn" id="btnBackHome">🏠 Menu</button>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN 3: Hasil ===== -->
  <div id="screenResult" class="hidden">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-title" id="resultTitle">Hebat sekali!</div>
      <div class="result-sub" id="resultSub">Kamu menjawab benar 8 dari 8!</div>
      <div class="stars-final" id="resultStars">⭐⭐⭐</div>
      <button class="primary-btn" id="btnPlayAgain">Main Lagi</button>
      <br>
      <button class="secondary-btn" id="btnChooseOther">Pilih tema lain</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------------- Data kata per kategori ----------------
  const WORD_BANK = {
    animals: [
      {emoji:"🐶", id:"Anjing", en:"Dog"},
      {emoji:"🐱", id:"Kucing", en:"Cat"},
      {emoji:"🐘", id:"Gajah", en:"Elephant"},
      {emoji:"🦁", id:"Singa", en:"Lion"},
      {emoji:"🐰", id:"Kelinci", en:"Rabbit"},
      {emoji:"🐟", id:"Ikan", en:"Fish"},
      {emoji:"🐸", id:"Katak", en:"Frog"},
      {emoji:"🐔", id:"Ayam", en:"Chicken"},
      {emoji:"🐮", id:"Sapi", en:"Cow"},
      {emoji:"🦆", id:"Bebek", en:"Duck"},
    ],
    colors: [
      {emoji:"🔴", id:"Merah", en:"Red"},
      {emoji:"🔵", id:"Biru", en:"Blue"},
      {emoji:"🟡", id:"Kuning", en:"Yellow"},
      {emoji:"🟢", id:"Hijau", en:"Green"},
      {emoji:"🟠", id:"Oranye", en:"Orange"},
      {emoji:"🟣", id:"Ungu", en:"Purple"},
      {emoji:"⚪", id:"Putih", en:"White"},
      {emoji:"⚫", id:"Hitam", en:"Black"},
      {emoji:"🟤", id:"Coklat", en:"Brown"},
      {emoji:"🩷", id:"Merah muda", en:"Pink"},
    ],
    fruits: [
      {emoji:"🍎", id:"Apel", en:"Apple"},
      {emoji:"🍌", id:"Pisang", en:"Banana"},
      {emoji:"🍇", id:"Anggur", en:"Grapes"},
      {emoji:"🍊", id:"Jeruk", en:"Orange"},
      {emoji:"🍓", id:"Stroberi", en:"Strawberry"},
      {emoji:"🍉", id:"Semangka", en:"Watermelon"},
      {emoji:"🍍", id:"Nanas", en:"Pineapple"},
      {emoji:"🥭", id:"Mangga", en:"Mango"},
      {emoji:"🍑", id:"Persik", en:"Peach"},
      {emoji:"🍒", id:"Ceri", en:"Cherry"},
    ],
    numbers: [
      {emoji:"1️⃣", id:"Satu", en:"One"},
      {emoji:"2️⃣", id:"Dua", en:"Two"},
      {emoji:"3️⃣", id:"Tiga", en:"Three"},
      {emoji:"4️⃣", id:"Empat", en:"Four"},
      {emoji:"5️⃣", id:"Lima", en:"Five"},
      {emoji:"6️⃣", id:"Enam", en:"Six"},
      {emoji:"7️⃣", id:"Tujuh", en:"Seven"},
      {emoji:"8️⃣", id:"Delapan", en:"Eight"},
      {emoji:"9️⃣", id:"Sembilan", en:"Nine"},
      {emoji:"🔟", id:"Sepuluh", en:"Ten"},
    ],
    body: [
      {emoji:"👀", id:"Mata", en:"Eyes"},
      {emoji:"👃", id:"Hidung", en:"Nose"},
      {emoji:"👂", id:"Telinga", en:"Ear"},
      {emoji:"👄", id:"Mulut", en:"Mouth"},
      {emoji:"✋", id:"Tangan", en:"Hand"},
      {emoji:"🦶", id:"Kaki", en:"Foot"},
      {emoji:"🦷", id:"Gigi", en:"Teeth"},
      {emoji:"💇", id:"Rambut", en:"Hair"},
      {emoji:"❤️", id:"Jantung", en:"Heart"},
      {emoji:"🫲", id:"Jari", en:"Finger"},
    ]
  };

  const CAT_MASCOT_LINE = {
    animals: "Ayo kenalan sama hewan-hewan!",
    colors: "Warna-warni seru, yuk!",
    fruits: "Buah-buahan enak, apa namanya?",
    numbers: "Yuk berhitung dalam bahasa Inggris!",
    body: "Ini bagian tubuhmu, tau namanya?"
  };

  const ROUNDS_PER_GAME = 8;

  // ---------------- State ----------------
  let totalScore = 0;
  let currentCategory = null;
  let questions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let answered = false;

  // ---------------- DOM refs ----------------
  const screenIntro = document.getElementById('screenIntro');
  const screenGame = document.getElementById('screenGame');
  const screenResult = document.getElementById('screenResult');
  const scorePill = document.getElementById('scorePill');
  const progressRow = document.getElementById('progressRow');
  const mascotGame = document.getElementById('mascotGame');
  const mascotIntro = document.getElementById('mascotIntro');
  const speechBubble = document.getElementById('speechBubble');
  const bigEmoji = document.getElementById('bigEmoji');
  const indoHint = document.getElementById('indoHint');
  const optionsWrap = document.getElementById('optionsWrap');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const resultStars = document.getElementById('resultStars');
  const btnSpeaker = document.getElementById('btnSpeaker');

  // ---------------- Audio (simple tones, no external files) ----------------
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function playTone(freqs, duration){
    const ctx = getCtx();
    if(!ctx) return;
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i*0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.09 + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.09);
      osc.stop(ctx.currentTime + i*0.09 + duration);
    });
  }
  function playCorrectSound(){ playTone([523.25, 659.25, 783.99], 0.25); }
  function playWrongSound(){ playTone([220, 180], 0.3); }

  // ---------------- Text-to-speech (pengucapan kata Inggris) ----------------
  let englishVoice = null;
  function pickEnglishVoice(){
    if(!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    if(!voices || voices.length === 0) return;
    englishVoice =
      voices.find(v => /en-US/i.test(v.lang) && /female|child|zira|samantha/i.test(v.name)) ||
      voices.find(v => /en-US/i.test(v.lang)) ||
      voices.find(v => /^en/i.test(v.lang)) ||
      null;
  }
  if(window.speechSynthesis){
    pickEnglishVoice();
    window.speechSynthesis.onvoiceschanged = pickEnglishVoice;
  }

  function speakWord(text){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.8;
    utter.pitch = 1.15;
    if(englishVoice) utter.voice = englishVoice;
    btnSpeaker.classList.add('speaking');
    utter.onend = () => btnSpeaker.classList.remove('speaking');
    utter.onerror = () => btnSpeaker.classList.remove('speaking');
    window.speechSynthesis.speak(utter);
  }

  // ---------------- Helpers ----------------
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions(catKey){
    const bank = WORD_BANK[catKey];
    const chosen = shuffle(bank).slice(0, Math.min(ROUNDS_PER_GAME, bank.length));
    return chosen.map(item => {
      const distractors = shuffle(bank.filter(w => w.en !== item.en)).slice(0, 2);
      const opts = shuffle([item, ...distractors]).map(o => o.en);
      return { emoji: item.emoji, id: item.id, en: item.en, options: opts };
    });
  }

  function updateScorePill(){
    scorePill.textContent = "⭐ " + totalScore;
  }

  function renderProgress(){
    progressRow.innerHTML = "";
    for(let i = 0; i < questions.length; i++){
      const span = document.createElement('div');
      span.className = "prog-star" + (i < currentIndex ? " filled" : "");
      span.textContent = "⭐";
      progressRow.appendChild(span);
    }
  }

  function launchConfetti(){
    const colors = ["#FFD93D", "#6BCBFF", "#FF6FA5", "#4CD787", "#B98CFF"];
    for(let i = 0; i < 22; i++){
      const piece = document.createElement('div');
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 3000);
    }
  }

  function setSpeech(text){
    speechBubble.textContent = text;
  }

  // ---------------- Screen: Intro ----------------
  document.querySelectorAll('.cat-card').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCategory = btn.getAttribute('data-cat');
      startGame(currentCategory);
    });
  });

  // ---------------- Screen: Game ----------------
  function startGame(catKey){
    questions = buildQuestions(catKey);
    currentIndex = 0;
    correctCount = 0;
    screenIntro.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenGame.classList.remove('hidden');
    mascotGame.textContent = "🦉";
    setSpeech(CAT_MASCOT_LINE[catKey] || "Ayo mulai!");
    renderProgress();
    showQuestion();
  }

  function showQuestion(){
    answered = false;
    const q = questions[currentIndex];
    bigEmoji.textContent = q.emoji;
    bigEmoji.style.animation = 'none';
    void bigEmoji.offsetWidth; // restart animation
    bigEmoji.style.animation = '';
    indoHint.textContent = q.id;
    renderProgress();

    optionsWrap.innerHTML = "";
    q.options.forEach(optText => {
      const b = document.createElement('button');
      b.className = "opt-btn";
      b.textContent = optText;
      b.addEventListener('click', () => handleAnswer(b, optText, q.en));
      optionsWrap.appendChild(b);
    });

    setTimeout(() => speakWord(q.en), 350);
  }

  function handleAnswer(btnEl, chosen, correctAnswer){
    if(answered) return;
    answered = true;
    const isCorrect = chosen === correctAnswer;
    const allBtns = optionsWrap.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if(isCorrect){
      btnEl.classList.add('correct');
      totalScore += 1;
      correctCount += 1;
      updateScorePill();
      mascotGame.classList.remove('sad'); mascotGame.classList.add('happy');
      setSpeech(pickPraise());
      playCorrectSound();
      launchConfetti();
    } else {
      btnEl.classList.add('wrong');
      allBtns.forEach(b => { if(b.textContent === correctAnswer) b.classList.add('correct'); });
      mascotGame.classList.remove('happy'); mascotGame.classList.add('sad');
      setSpeech("Hampir! Jawabannya " + correctAnswer + " ✏️");
      playWrongSound();
      setTimeout(() => speakWord(correctAnswer), 400);
    }

    setTimeout(() => {
      mascotGame.classList.remove('happy', 'sad');
      currentIndex += 1;
      if(currentIndex < questions.length){
        showQuestion();
      } else {
        showResult();
      }
    }, 1300);
  }

  function pickPraise(){
    const lines = ["Betul sekali! 🎉", "Hebat! 🌟", "Pintar! 👏", "Yes! Kamu jago! 💪", "Keren banget! 🥳"];
    return lines[Math.floor(Math.random() * lines.length)];
  }

  btnSpeaker.addEventListener('click', () => {
    const q = questions[currentIndex];
    if(q) speakWord(q.en);
  });

  document.getElementById('btnBackHome').addEventListener('click', () => {
    screenGame.classList.add('hidden');
    screenIntro.classList.remove('hidden');
  });

  // ---------------- Screen: Result ----------------
  function showResult(){
    screenGame.classList.add('hidden');
    screenResult.classList.remove('hidden');

    const ratio = correctCount / questions.length;
    let stars = 1;
    if(ratio >= 0.9) stars = 3;
    else if(ratio >= 0.6) stars = 2;

    resultEmoji.textContent = stars === 3 ? "🏆" : stars === 2 ? "🎉" : "🌈";
    resultTitle.textContent = stars === 3 ? "Luar biasa!" : stars === 2 ? "Kerja bagus!" : "Terus berlatih ya!";
    resultSub.textContent = "Kamu menjawab benar " + correctCount + " dari " + questions.length + " soal.";
    resultStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);

    if(stars === 3) launchConfetti();
  }

  document.getElementById('btnPlayAgain').addEventListener('click', () => {
    startGame(currentCategory);
  });
  document.getElementById('btnChooseOther').addEventListener('click', () => {
    screenResult.classList.add('hidden');
    screenIntro.classList.remove('hidden');
  });

  updateScorePill();
})();
</script>
</body>
</html>
